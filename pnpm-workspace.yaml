packages:
  - packages/*
  - tooling/*
  # Runnable examples. Private, never published — they consume the packages
  # exactly the way an external project does: through a workspace link.
  - examples/*
  # Nested examples/playground dirs INSIDE packages are not workspaces. Negative
  # patterns come after positive ones, so `examples/*` above survives.
  - '!packages/**/examples/**'
  - '!**/playground/**'

# Supply-chain hygiene: these packages get embedded in wallets and touch
# transactions. Fresh dependency versions are quarantined (in minutes) so a
# just-published — and possibly compromised — version is not picked up.
minimumReleaseAge: 1440

# The single source of truth for shared dependency versions. In a package:
# "viem": "catalog:".
catalog:
  typescript: ^5.8.3
  tsup: ^8.3.5
  vitest: ^2.1.8
  viem: ^2.21.54
  '@wagmi/core': ^2.13.0

allowBuilds:
  bufferutil: false
  esbuild: true
  keccak: false
  utf-8-validate: false
