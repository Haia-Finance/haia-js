packages:
  - packages/*
  - tooling/*
  # Запускаемые примеры. Приватные, не публикуются — потребляют пакеты ровно
  # так же, как это делает внешний проект: через workspace-линк.
  - examples/*
  # Вложенные examples/playground ВНУТРИ пакетов — не воркспейсы. Негативные
  # паттерны идут после позитивных, поэтому `examples/*` выше уцелеет.
  - '!packages/**/examples/**'
  - '!**/playground/**'

# Supply-chain гигиена: пакет встраивается в кошельки и трогает транзакции.
# Карантин свежих версий зависимостей (минуты); не даём подхватить только что
# опубликованную (потенциально скомпрометированную) версию.
minimumReleaseAge: 1440

# Единый источник правды по версиям общих зависимостей. В пакетах: "viem": "catalog:".
catalog:
  typescript: ^5.8.3
  tsup: ^8.3.5
  vitest: ^2.1.8
  viem: ^2.21.54
  '@wagmi/core': ^2.13.0

allowBuilds:
  bufferutil: false
  esbuild: true
  keccak: false
  utf-8-validate: false
